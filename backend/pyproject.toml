[project]
name = "408-practice-backend"
version = "0.1.0"
description = "Backend API for the 真练真会 practice tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.3,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
